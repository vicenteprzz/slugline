[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slugline"
version = "0.20.0"
description = "Screenplay breakdown and analysis for Fountain and PDF scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vicente Pérez" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
llm = ["anthropic>=1.1"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42"]
export = ["reportlab>=4"]
all = ["slugline[pdf,llm,web,export]"]
# The desktop app: the dashboard in its own window, and the tools to package it.
desktop = ["slugline[all]", "pywebview>=5", "pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]
package = ["slugline[desktop]", "pyinstaller>=6"]
dev = ["slugline[all]", "pytest>=8", "httpx>=0.27"]

[project.scripts]
slugline = "slugline.cli:main"
slugline-app = "slugline.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The built dashboard (cd web && npm run build).
slugline = ["static/**/*", "examples/*", "license_public_key.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
